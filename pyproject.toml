[project]
name = "gen-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rohit verma", email = "rohitgcode20@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "jsonpatch>=1.33",
    "langchain>=1.3.14",
    "langchain-core>=1.5.3",
    "langchain-google-genai>=4.3.2",
    "langchain-mistralai>=1.1.6",
    "python-dotenv>=1.2.2",
    "streamlit>=1.60.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
]

[project.scripts]
gen-ai = "gen_ai:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
